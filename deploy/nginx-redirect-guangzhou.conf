# HTTP 80 端口的跳转站点。
# 配合内核 NAT 规则（PREROUTING 80 -> 8180，见服务器 /root/maze-nat.rules，
# 由 maze-nat-restore.service 开机恢复）使用：
# 访问 http://maze.mplusm.site 的流量被内核转到这里，301 跳转到正式站点。
# HTTPS 443 由 NAT 直接转到 8443 的正式站点，无需本文件参与。
server {
    listen 8180 default_server;
    server_name maze.mplusm.site;
    return 301 https://maze.mplusm.site:8443$request_uri;
}
