# Include inside the maze.mplusm.site HTTPS server, BEFORE generic regex locations.
# Runtime files are content-addressed; entry pages must always revalidate.
gzip_static on;
gzip_vary on;

location ~ ^/(engine|game)-[0-9a-f]+\.wasm$ {
    try_files $uri =404;
    types { application/wasm wasm; }
    default_type application/wasm;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
}

location ~ ^/(engine|game)-[0-9a-f]+\.(pck|js|audio\.worklet\.js|audio\.position\.worklet\.js)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
}

location = /index.html {
    add_header Cache-Control no-cache;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
}

location = / {
    try_files /index.html =404;
    add_header Cache-Control no-cache;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
}

location = /MANIFEST.json {
    add_header Cache-Control no-cache;
}
