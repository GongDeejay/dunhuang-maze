# maze.mplusm.site — 广州轻量应用服务器站点定义
# 由 deploy/install-guangzhou.sh 下发；请勿在服务器上直接编辑。
# 说明：80/443 已被 nps 内网穿透服务占用（家庭 Minecraft 隧道使用），
#      因此本站点监听 8443，访问地址为 https://maze.mplusm.site:8443/
server {
    listen 8443 ssl;
    http2 on;
    server_name maze.mplusm.site;

    root /www/wwwroot/maze.mplusm.site;
    index index.html;

    ssl_certificate     /etc/nginx/ssl/maze.mplusm.site/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/maze.mplusm.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MAZESSL:10m;
    ssl_session_timeout 1d;

    # Godot Web 运行时要求跨源隔离。
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 64m;

    # 预压缩资源与缓存策略（与本仓库 deploy/nginx-performance.conf 保持一致）。
    include /etc/nginx/dunhuang-performance.inc;
}
