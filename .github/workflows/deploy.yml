name: Build and Deploy Web

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
      - "assets/**"
      - "addons/**"
      - "deploy/**"
      - "tests/**"
      - "run_tests.sh"
      - "scripts/**"
      - "scenes/**"
      - "tools/**"
      - "project.godot"
      - "export_presets.cfg"
  workflow_dispatch:

concurrency:
  group: dunhuang-maze-production
  cancel-in-progress: true

permissions:
  # 需要写入权限：把构建产物发布为 Release 制品，供服务器主动拉取。
  contents: write

env:
  GODOT_VERSION: "4.7"
  # 生产目标：腾讯云广州轻量应用服务器（80/443 由 nps 家庭隧道占用，站点在 8443）。
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '101.33.209.194' }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
  DEPLOY_ROOT: /www/wwwroot/maze.mplusm.site
  SITE_NAME: maze.mplusm.site
  SITE_PORT: "8443"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install precompression and HTTP verification tools
        run: sudo apt-get update && sudo apt-get install -y brotli nginx

      - name: Cache Godot downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/dunhuang-godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-web

      - name: Install Godot and Web templates
        shell: bash
        run: |
          set -euo pipefail
          cache="$HOME/.cache/dunhuang-godot"
          mkdir -p "$cache" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          editor_zip="$cache/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          template_zip="$cache/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          test -f "$editor_zip" || curl -fL --retry 3 -o "$editor_zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          test -f "$template_zip" || curl -fL --retry 3 -o "$template_zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -qo "$editor_zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo ln -s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          unzip -qo "$template_zip" -d "$RUNNER_TEMP/templates"
          cp -R "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import and test
        run: |
          python3 -m unittest discover -s tests -p 'test_web_export.py'
          BECKETT_ENABLE=0 godot --headless --path . --import --quit
          BECKETT_ENABLE=0 ./run_tests.sh

      - name: Export versioned Web build
        shell: bash
        run: |
          set -euo pipefail
          build_id="${GITHUB_SHA:0:12}"
          test "$GODOT_VERSION" = "$(python3 -c 'import json; print(json.load(open("deploy/godot-runtime-lock.json"))["godot_version"])')"
          executable="game-${build_id}"
          mkdir -p dist
          BECKETT_ENABLE=0 godot --headless --path . --export-release Web "dist/${executable}.html"
          mv "dist/${executable}.html" dist/index.html
          python3 tools/optimize_web_export.py dist
          cp deploy/nginx.conf.example dist/nginx.conf.example
          python3 tools/generate_web_manifest.py dist

      - name: Verify compression negotiation and fallback
        run: python3 tools/verify_http_compression.py dist --nginx /usr/sbin/nginx

      - name: Verify startup payload
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          python3 tools/verify_pack_budget.py dist
          test "$(find dist -name '*.wasm.gz' | wc -l)" -eq 1
          test "$(find dist -name '*.wasm.br' | wc -l)" -eq 1
          du -h dist/* | sort -h

      - uses: actions/upload-artifact@v4
        with:
          name: dunhuang-maze-web-${{ github.sha }}
          path: dist/
          retention-days: 14

      - name: Check deployment credentials
        id: deploy_config
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.LIGHTHOUSE_GZ_SSH_KEY }}
        run: |
          if [[ -n "$DEPLOY_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Build succeeded, but LIGHTHOUSE_GZ_SSH_KEY is not configured; deployment skipped."
          fi

      - name: Configure SSH
        if: steps.deploy_config.outputs.enabled == 'true'
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.LIGHTHOUSE_GZ_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Install nginx site definition and compression policy
        if: steps.deploy_config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          host="${DEPLOY_USER}@${DEPLOY_HOST}"
          scp deploy/nginx-main-guangzhou.conf "$host:/tmp/maze-gz-main-${GITHUB_SHA}.conf"
          scp deploy/nginx-guangzhou.conf "$host:/tmp/maze-gz-site-${GITHUB_SHA}.conf"
          scp deploy/nginx-performance.conf "$host:/tmp/maze-gz-perf-${GITHUB_SHA}.inc"
          scp deploy/nginx-redirect-guangzhou.conf "$host:/tmp/maze-gz-redirect-${GITHUB_SHA}.conf"
          ssh "$host" bash -s -- "$GITHUB_SHA" < deploy/install-guangzhou.sh

      - name: Package release artifact
        if: steps.deploy_config.outputs.enabled == 'true'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          rev="${GITHUB_SHA:0:12}"
          asset="dist-${rev}.tar.gz"
          tar -C dist -czf "$asset" .
          sha="$(sha256sum "$asset" | awk '{print $1}')"
          echo "rev=$rev"      >> "$GITHUB_OUTPUT"
          echo "asset=$asset"  >> "$GITHUB_OUTPUT"
          echo "sha256=$sha"   >> "$GITHUB_OUTPUT"
          du -h "$asset"

      - name: Publish artifact to release channel
        if: steps.deploy_config.outputs.enabled == 'true'
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="deploy-${{ steps.package.outputs.rev }}"
          asset="${{ steps.package.outputs.asset }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "Deploy ${{ steps.package.outputs.rev }}" \
            --notes "Automated production artifact for ${GITHUB_SHA}"
          gh release upload "$tag" "$asset" --clobber
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${asset}" >> "$GITHUB_OUTPUT"
          # 只保留最近 5 个部署制品，避免仓库无限膨胀
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("deploy-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | while read -r stale; do
                if [ -n "${stale:-}" ]; then gh release delete "$stale" --yes --cleanup-tag || true; fi
              done

      - name: Pull-deploy on server (artifact never crosses the runner network)
        if: steps.deploy_config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          host="${DEPLOY_USER}@${DEPLOY_HOST}"
          # 只下发部署器（几 KB），构建产物由服务器自己拉取并校验。
          scp deploy/maze-deploy.sh "$host:/usr/local/bin/maze-deploy"
          ssh "$host" "chmod 0755 /usr/local/bin/maze-deploy"
          ssh "$host" "/usr/local/bin/maze-deploy \
            --version '${{ steps.package.outputs.rev }}' \
            --sha256 '${{ steps.package.outputs.sha256 }}' \
            --url '${{ steps.publish.outputs.url }}'"

      - name: Verify production (DNS-independent, pinned to deploy host)
        if: steps.deploy_config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://${SITE_NAME}:${SITE_PORT}"
          pin=(--resolve "${SITE_NAME}:${SITE_PORT}:${DEPLOY_HOST}")
          curl -fsSL --retry 5 --retry-delay 3 "${pin[@]}" "$base/index.html" -o /dev/null
          curl -fsS "${pin[@]}" "$base/MANIFEST.json" -o /tmp/production-manifest.json
          python3 -c 'import json,os; assert json.load(open("/tmp/production-manifest.json"))["git_revision"] == os.environ["GITHUB_SHA"]'
          curl -fsSI "${pin[@]}" "$base/index.html" | grep -qi 'cross-origin-opener-policy: same-origin'
          curl -fsSI "${pin[@]}" "$base/index.html" | grep -qi 'cache-control: no-cache'
          runtime="$(find dist -name 'engine-*.wasm' -exec basename {} \;)"
          headers="$(curl -fsSI "${pin[@]}" -H 'Accept-Encoding: gzip' "$base/$runtime")"
          echo "$headers" | grep -qi 'content-encoding: gzip'
          echo "$headers" | grep -qi 'immutable'
          echo "$headers" | grep -qi 'content-type: application/wasm'
          compressed_size="$(stat -c %s "dist/$runtime.gz")"
          echo "$headers" | tr -d '\r' | grep -qi "content-length: $compressed_size"
          br_headers="$(curl -fsSI "${pin[@]}" -H 'Accept-Encoding: br,gzip' "$base/$runtime")"
          echo "$br_headers" | grep -qi 'content-encoding: br'
          echo "$br_headers" | grep -qi 'content-type: application/wasm'
          echo "$br_headers" | grep -qi 'vary:.*Accept-Encoding'
          br_size="$(stat -c %s "dist/$runtime.br")"
          echo "$br_headers" | tr -d '\r' | grep -qi "content-length: $br_size"
          curl -fsS "${pin[@]}" -H 'Accept-Encoding: br' "$base/$runtime" -o /tmp/production-engine.br
          brotli -d -c /tmp/production-engine.br | cmp - "dist/$runtime"
          for image in dist/intro-*.webp; do
            image_headers="$(curl -fsSI "${pin[@]}" "$base/$(basename "$image")")"
            echo "$image_headers" | grep -qi 'content-type: image/webp'
            echo "$image_headers" | grep -qi 'cache-control:.*immutable'
          done
