name: Web Export Check

on:
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - "assets/**"
      - "scenes/**"
      - "project.godot"
      - "export_presets.cfg"
  workflow_dispatch:

jobs:
  export-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7 + export templates
        run: |
          GODOT_VERSION="4.7"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_web_template.tpz"
          unzip -q Godot_v${GODOT_VERSION}-stable_web_template.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Export Web build
        run: |
          godot --headless --path . --import --quit
          mkdir -p web
          godot --headless --path . --export-release "Web" web/index.html

      - name: Verify artifacts
        run: |
          test -f web/index.html
          test -f web/index.pck
          test -f web/index.wasm
          ls -lh web/index.*
