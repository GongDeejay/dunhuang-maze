name: PR Web Preview

# 只构建并上传可试玩的 Web 预览包。不部署、不发布 Pages、不创建 Release、不使用 secrets。
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dunhuang-maze-pr-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7"
  PREVIEW_PR: ${{ github.event.pull_request.number || 'manual' }}
  # pull_request 上 github.sha 是本次实际检出并导出的合并提交。
  PREVIEW_SHA: ${{ github.sha }}

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install precompression tools
        run: sudo apt-get update && sudo apt-get install -y brotli

      - name: Cache Godot downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/dunhuang-godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-web

      - name: Install Godot and Web templates
        shell: bash
        run: |
          set -euo pipefail
          cache="$HOME/.cache/dunhuang-godot"
          mkdir -p "$cache" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          editor_zip="$cache/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          template_zip="$cache/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          test -f "$editor_zip" || curl -fL --retry 3 -o "$editor_zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          test -f "$template_zip" || curl -fL --retry 3 -o "$template_zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -qo "$editor_zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo ln -s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          unzip -qo "$template_zip" -d "$RUNNER_TEMP/templates"
          cp -R "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import and test
        run: |
          python3 -m unittest discover -s tests -p 'test_web_export.py'
          BECKETT_ENABLE=0 godot --headless --path . --import --quit
          BECKETT_ENABLE=0 ./run_tests.sh

      - name: Export versioned Web build
        shell: bash
        run: |
          set -euo pipefail
          build_id="${GITHUB_SHA:0:12}"
          test "$GODOT_VERSION" = "$(python3 -c 'import json; print(json.load(open("deploy/godot-runtime-lock.json"))["godot_version"])')"
          executable="game-${build_id}"
          mkdir -p dist
          BECKETT_ENABLE=0 godot --headless --path . --export-release Web "dist/${executable}.html"
          mv "dist/${executable}.html" dist/index.html
          python3 tools/optimize_web_export.py dist
          cp deploy/nginx.conf.example dist/nginx.conf.example
          python3 tools/generate_web_manifest.py dist

      - name: Verify startup payload
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          # 无线程导出才允许用普通静态服务试玩；线程导出会要求 COOP/COEP。
          grep -q 'const GODOT_THREADS_ENABLED = false;' dist/index.html
          python3 tools/verify_pack_budget.py dist
          mapfile -t wasm_files < <(find dist -name 'engine-*.wasm' -printf '%f\n')
          mapfile -t pck_files < <(find dist -name 'game-*.pck' -printf '%f\n')
          test "${#wasm_files[@]}" -eq 1
          test "${#pck_files[@]}" -eq 1
          wasm="${wasm_files[0]}"
          pck="${pck_files[0]}"
          # 预压缩是旁路副本。未压缩原文件必须留在包里，python http.server 才能直接打开。
          test -f "dist/${wasm}"
          test -f "dist/${wasm}.gz"
          test -f "dist/${wasm}.br"
          test -f "dist/${pck}"
          test -f "dist/${pck}.gz"
          test -f "dist/${pck}.br"
          test "$(find dist -name '*.wasm.gz' | wc -l)" -eq 1
          test "$(find dist -name '*.wasm.br' | wc -l)" -eq 1
          du -h dist/* | sort -h

      - name: Write local play instructions
        shell: bash
        env:
          ARTIFACT_NAME: dunhuang-maze-web-pr-${{ env.PREVIEW_PR }}-${{ env.PREVIEW_SHA }}
        run: |
          set -euo pipefail
          cat > dist/PREVIEW.txt <<EOF
          敦煌迷途 — Pull Request Web 预览

          产物：${ARTIFACT_NAME}
          PR：${PREVIEW_PR}
          提交：${PREVIEW_SHA}
          入口：index.html

          本地试玩
          1. 在本 PR 的 Actions 运行页面下载上述产物 zip，并解压。
          2. 进入解压后含有 index.html 的目录。
          3. 在该目录运行：
             python3 -m http.server 8000
          4. 用浏览器打开：
             http://127.0.0.1:8000/

          响应头
          本包是无线程 Web 导出（variant/thread_support=false，页面中 GODOT_THREADS_ENABLED 为 false）。
          Godot 只在启用线程时才把 Cross-Origin-Opener-Policy、Cross-Origin-Embedder-Policy
          和 SharedArrayBuffer 当作启动条件。因此本地试玩不需要这些响应头。
          请使用 http://127.0.0.1 或 http://localhost。Godot 要求 Secure Context，本机回环地址满足该条件。

          预压缩文件
          优化步骤会在 .wasm、.pck、.js 旁边另外生成 .gz，并为 .wasm、.pck 生成 .br。
          未压缩的原文件仍然保留，页面请求的也是这些原文件名。
          python3 -m http.server 按 URL 原样返回文件，不会把 .br 或 .gz 当作正文，所以可以直接加载。
          .br 与 .gz 是给会做内容协商的服务器使用的副本；用普通静态服务时可以忽略。

          MANIFEST.json 里的 headers_required 来自与生产相同的清单生成步骤，
          描述的是生产站点策略，不是打开本预览包的前提。
          EOF
          sed -i 's/^[[:space:]]*//' dist/PREVIEW.txt
          {
            echo "## 本地试玩"
            echo
            echo "产物：\`${ARTIFACT_NAME}\`（保留 14 天）。下载 zip 并解压，进入含有 \`index.html\` 的目录后执行："
            echo
            echo '```bash'
            echo "python3 -m http.server 8000"
            echo '```'
            echo
            echo "浏览器打开 http://127.0.0.1:8000/ 。"
            echo
            echo "这是无线程导出，不需要 COOP/COEP。\`.br\` / \`.gz\` 是预压缩副本，未压缩原文件已保留，普通静态服务可以直接加载。完整说明见产物内的 \`PREVIEW.txt\`。"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dunhuang-maze-web-pr-${{ env.PREVIEW_PR }}-${{ env.PREVIEW_SHA }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
